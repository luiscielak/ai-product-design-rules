# .cursorrules

## Workflow Overview
These rules define a structured AI product design workflow with five sequential stages:
1. **Project Setup** (/new-project) → 2. **PRD** (/prd) → 3. **Lo-Fi Wireframes** (/lofi) → 4. **Mid-Fi Wireframes** (/midfi) → 5. **Hi-Fi Design** (/hifi) → 6. **Prototype** (/ui-proto)

Each stage builds on the previous. When a command is invoked, check for prerequisite outputs and reference them.

### Design System Parameter (shared)
- **Input:** `design_system` (`shadcn` | `konstrukt`, default: `shadcn`)
- Persist the choice in `projects/{project_name}/README.md` (and reuse it on later commands if omitted).
- **`shadcn` (default):** existing behavior. Tailwind + shadcn/ui. Mid-fi tokens include radius and shadows. Hi-fi may use rounded corners, subtle shadows, and soft gradients. `/ui-proto` installs shadcn components.
- **`konstrukt`:** [Konstrukt v2.0.0](https://github.com/the-hooman-loop/konstrukt) (MIT). Swiss / Bauhaus: square corners (`--radius: 0px`), no shadows (`--shadow: none`), one palette (`atelier`), light and dark via `data-mode` on `<html>` (`light` is `:root`; `[data-theme="dark"]` is a legacy alias), layered tokens (primitives → global → semantic → dark overrides), 8 type roles (`display`, `heading`, `subheading`, `label`, `badge`, `body`, `meta`, `mono`), stroke tokens (`--stroke-hairline` / `--stroke-rule` / `--stroke-rail`), 80-pair WCAG AA contrast gate. Teal is reserved for the one primary action on a surface.
- When `konstrukt` is chosen, `/midfi` tokens, `/hifi` theme and principles, and `/ui-proto` styling **must consume Konstrukt build output** — `dist/css/konstrukt.css`, `dist/css/base.css`, `dist/css/theme.js` (`HLTheme`), and `dist/tokens.json` from the tagged `v2.0.0` release. Vendor those generated files into the project. **Never hand-type hex** (or invent radius/shadow/gradient values). Reference CSS custom properties (`var(--accent)`, `var(--type-body)`, `var(--sp-4)`). Drop rounded-corner, shadow, and gradient guidance.

