# .cursorrules

## Workflow Overview
These rules define a structured AI product design workflow with six stages:
1. **Project Setup** (`/new-project`) → 2. **PRD** (`/prd`) → 3. **Lo-Fi** (`/lofi`) → 4. **Mid-Fi** (`/midfi`) → then **either or both** of 5. **Prototype** (`/ui-proto`) and 6. **Hi-Fi** (`/hifi`)

`/ui-proto` and `/hifi` both require mid-fi only. Hi-fi is **optional** before `/ui-proto`. If `design/ui-design/` is missing, style the prototype from mid-fi tokens. Recommended default order: `/new-project` → `/prd` → `/lofi` → `/midfi` → `/ui-proto` → `/hifi`.

Artifact root is **`design/`** (not `docs/wireframes/`):
- Lo-fi / mid-fi → `design/wireframes/{lofi,midfi}/`
- Hi-fi → `design/ui-design/`
- PRD → `docs/PRD.md`
- Prototype → `app/`

When a command is invoked, check for prerequisite outputs and reference them.

### Design System Parameter (shared)
- **Input:** `design_system` (`shadcn` | `konstrukt`, default: `shadcn`)
- Persist the choice in `projects/{project_name}/README.md` (and reuse it on later commands if omitted).
- The two stacks are **exclusive**. Do not install shadcn in a Konstrukt project, and do not vendor Konstrukt into a shadcn project.
- **`shadcn` (default):** Tailwind + shadcn/ui. Mid-fi tokens include radius and shadows. Hi-fi may use rounded corners, subtle shadows, and soft gradients. `/ui-proto` follows the **shadcn recipe** only.
- **`konstrukt`:** [Konstrukt v2.0.0](https://github.com/the-hooman-loop/konstrukt) (MIT). Swiss / Bauhaus: square corners (`--radius: 0px`), no shadows (`--shadow: none`), one palette (`atelier`), light and dark via `data-mode` on `<html>` (`light` is `:root`; `[data-theme="dark"]` is a legacy alias), layered tokens (primitives → global → semantic → dark overrides), 8 type roles (`display`, `heading`, `subheading`, `label`, `badge`, `body`, `meta`, `mono`), stroke tokens (`--stroke-hairline` / `--stroke-rule` / `--stroke-rail`), 80-pair WCAG AA contrast gate. Teal is reserved for the one primary action on a surface.
- **Konstrukt consumption (exact):** `@hooman-loop/konstrukt` is `private` on npm — do **not** `npm install` it. Copy generated files from the git tag `v2.0.0` (`dist/` after `npm run build` in that clone) into the **single** vendor path `projects/{project_name}/vendor/konstrukt-2.0.0/` (project root, sibling of `app/` and `design/`):
  - `konstrukt.css` ← `dist/css/konstrukt.css`
  - `base.css` ← `dist/css/base.css`
  - `theme.js` ← `dist/css/theme.js` (`HLTheme`)
  - `tokens.json` ← `dist/tokens.json`
- **Never create `design/vendor/`.** Mid-fi and hi-fi HTML must `<link>` the project-root vendor files with relative paths (`../../../vendor/konstrukt-2.0.0/` from `design/wireframes/midfi/`, `../../vendor/konstrukt-2.0.0/` from `design/ui-design/`). Do not copy `dist/` under `design/`.
- Never hand-type hex. Never invent radius, shadow, or gradient values. Reference `var(--accent)`, `var(--type-body)`, `var(--sp-4)`, etc. **Banned** under `konstrukt`: `rounded-*`, `shadow-*`, `bg-gradient-*`, `box-shadow`, `border-radius` except `var(--radius)`, soft-gradient guidance.

